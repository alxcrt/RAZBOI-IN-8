{
  "version": 2,
  "updates": [
    {
      "package-ecosystem": "docker",
      "directory": "/",
      "schedule": {
        "interval": "daily",
        "time": "04:00",
        "timezone": "Europe/Bucharest"
      },
      "cooldown": {
        "default-days": 3
      },
      "open-pull-requests-limit": 5,
      "groups": {
        "routine": {
          "patterns": [
            "*"
          ],
          "update-types": [
            "minor",
            "patch"
          ]
        }
      },
      "target-branch": "web"
    },
    {
      "package-ecosystem": "github-actions",
      "directory": "/",
      "schedule": {
        "interval": "weekly"
      },
      "target-branch": "web"
    }
  ]
}
